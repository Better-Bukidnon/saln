name: CI
on:
  push:
  pull_request:
env:
  CI: '1'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate-data
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Fixture-backed e2e (project chromium) and the real-data smoke test (project smoke).
      - run: npm run e2e
      # Lighthouse reuses the Playwright Chromium.
      - name: Lighthouse CI
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm run lhci
